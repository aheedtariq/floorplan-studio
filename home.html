<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard — Floorplan Studio · Source One Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,650;14..32,700&display=swap" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%237c5cfc'/><g fill='none' stroke='white' stroke-width='8'><rect x='22' y='22' width='24' height='24'/><rect x='54' y='22' width='24' height='24'/><rect x='22' y='54' width='56' height='24'/></g></svg>" />
<style>
  :root {
    --accent: #7c5cfc; --accent-2: #5a3fd6; --accent-soft: rgba(124,92,252,.12);
    --bg: #f7f8fa; --card: #fff; --line: #e2e6ee; --line-2: #cdd4e0;
    --tx: #131a26; --tx-2: #5a6779; --tx-3: #5f6b82;
    --ok: #15803d; --err: #b91c1c; --r: 12px;
    --shadow: 0 10px 30px rgba(20,30,60,.10);
  }
  * { box-sizing: border-box; }
  /* a class that sets display outranks the UA rule for [hidden] */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--tx);
    font: 14px/1.6 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }

  /* ---------- top bar ---------- */
  .top {
    height: 60px; background: var(--card); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 22px;
    position: sticky; top: 0; z-index: 20;
  }
  .top .logo { display: flex; align-items: center; gap: 10px; }
  .top .logo svg { width: 30px; height: 30px; border-radius: 8px; }
  .top .logo b { font-size: 14px; display: block; line-height: 1.15; letter-spacing: -.01em; }
  .top .logo span { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--tx-3); font-weight: 600; }
  .top .grow { flex: 1; }
  .who { font-size: 13px; color: var(--tx-2); }
  .who b { color: var(--tx); }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; border: none; cursor: pointer;
    font: 560 13.5px/1 "Inter", sans-serif; border-radius: 9px; padding: 9px 14px; transition: .15s;
    text-decoration: none;
  }
  .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--tx-2); }
  .btn.ghost:hover { color: var(--tx); border-color: var(--line-2); }
  .btn.soft { background: var(--accent-soft); color: var(--accent); }
  .btn.soft:hover { background: rgba(124,92,252,.2); }
  .mini {
    border: 1px solid var(--line); background: var(--card); color: var(--tx-2);
    font: 560 12px/1 "Inter", sans-serif; border-radius: 7px; padding: 6.5px 10px; cursor: pointer; transition: .12s;
  }
  .mini:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- page ---------- */
  .page { max-width: 1080px; margin: 0 auto; padding: 34px 22px 80px; }
  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .page-head .grow { flex: 1; }
  .sub { color: var(--tx-3); font-size: 13px; margin: 2px 0 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }

  .plan-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 4px;
    transition: .15s; position: relative;
  }
  .plan-card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
  .plan-card h3 { margin: 0; font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }
  .plan-meta { font-size: 12.5px; color: var(--tx-3); display: flex; gap: 8px; flex-wrap: wrap; }
  .plan-meta b { color: var(--tx-2); font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 650;
    border-radius: 99px; padding: 3px 9px; width: fit-content; margin: 4px 0 2px;
  }
  .chip.client { background: #ecfdf5; color: var(--ok); }
  .chip.internal { background: var(--accent-soft); color: var(--accent); }
  .card-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }

  .empty {
    text-align: center; color: var(--tx-3); padding: 70px 20px;
    border: 1.5px dashed var(--line-2); border-radius: var(--r);
  }

  /* ---------- welcome / instructions overlay ---------- */
  .veil {
    position: fixed; inset: 0; background: rgba(15,20,32,.45); z-index: 50;
    display: grid; place-items: center; padding: 20px;
  }
  .sheet {
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    width: min(600px, 100%); max-height: 88vh; overflow: auto; padding: 30px 34px;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .sheet > p { color: var(--tx-3); margin: 0 0 20px; font-size: 14px; }
  .step { display: flex; gap: 14px; margin: 0 0 16px; }
  .step .n {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 99px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center;
  }
  .step > div > b { display: block; font-size: 14px; margin-bottom: 1px; }
  .step span { font-size: 13px; color: var(--tx-2); }
  .step span b { color: var(--tx); }
  .sheet-foot { display: flex; gap: 10px; margin-top: 22px; align-items: center; }
  .sheet-foot .grow { flex: 1; }

  /* ---------- tour (first-login tutorial) ---------- */
  .tour-top { display: flex; align-items: center; margin-bottom: 14px; }
  .tour-count { font-size: 12px; font-weight: 600; color: var(--tx-3); letter-spacing: .04em; }
  .tour-skip {
    margin-left: auto; background: none; border: none; cursor: pointer;
    font: 600 12.5px/1 inherit; font-family: inherit; color: var(--tx-3); padding: 6px 8px;
  }
  .tour-skip:hover { color: var(--accent); }
  .tour-ico {
    width: 52px; height: 52px; border-radius: 14px; margin-bottom: 14px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent); display: grid; place-items: center;
  }
  .tour-ico svg { width: 28px; height: 28px; }
  .tour-body { font-size: 14px; color: var(--tx-2); }
  .tour-body p { margin: 0 0 10px; }
  .tour-body b { color: var(--tx); }
  .tour-body ul { margin: 0; padding-left: 18px; }
  .tour-body li { margin: 0 0 8px; }
  .tour-dots { display: flex; gap: 6px; margin-top: 20px; }
  .tour-dots i {
    width: 8px; height: 8px; border-radius: 99px; background: var(--line-2);
    cursor: pointer; transition: .15s;
  }
  .tour-dots i.past { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  .tour-dots i.on { background: var(--accent); width: 22px; }
  .sheet.tour { min-height: 430px; display: flex; flex-direction: column; }
  .sheet.tour .tour-body { flex: 1; }

  /* ---------- small modal (links / photos / new plan) ---------- */
  .box { width: min(480px, 100%); }
  .box label { display: block; font-size: 12px; font-weight: 600; color: var(--tx-2); margin: 12px 0 5px; }
  .inp {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--tx);
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px; outline: none;
  }
  .inp:focus { border-color: var(--accent); }
  .linkrow { display: flex; gap: 8px; margin-top: 8px; }
  .linkrow .inp { font: 11.5px/1.5 ui-monospace, Menlo, monospace; }
  #boxMsg { min-height: 20px; font-size: 13px; margin-top: 10px; }
  #boxMsg.err { color: var(--err); } #boxMsg.ok { color: var(--ok); }
  .photo-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .loading { color: var(--tx-3); padding: 60px 0; text-align: center; }

  /* ---------- phone ---------- */
  @media (max-width: 640px) {
    .top { height: auto; flex-wrap: wrap; padding: 10px 14px; gap: 8px 10px; }
    .top .logo span { display: none; }
    .who { display: none; }
    .page { padding: 22px 14px 70px; }
    .page-head { flex-wrap: wrap; gap: 10px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo">
    <img src="assets/soe-logo.svg" alt="Source One Events" style="height:30px;display:block"/>
    <div style="border-left:1px solid var(--line-2);padding-left:10px;margin-left:2px">
      <b>Floorplan Studio</b>
    </div>
  </div>
  <div class="grow"></div>
  <span class="who" id="who"></span>
  <button class="mini" id="btnHelp" title="Show the getting-started steps">Getting started</button>
  <a class="mini" href="guide.html" target="_blank" rel="noopener" style="text-decoration:none">User guide</a>
  <button class="mini" id="btnAdmin" hidden>Admin</button>
  <button class="mini" id="btnOut">Sign out</button>
</header>

<div class="page">
  <div class="page-head">
    <div>
      <h1 id="pageTitle">Your plans</h1>
      <p class="sub" id="pageSub"></p>
    </div>
    <div class="grow"></div>
    <button class="btn primary" id="btnNew" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New plan
    </button>
  </div>

  <div id="content"><div class="loading">Loading your plans…</div></div>
</div>

<div id="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="js/geometry.js?v=73"></script>
<script src="js/config.js?v=73"></script>
<script src="js/state.js?v=95"></script>
<script src="js/backend.js?v=105"></script>
<script src="js/heartbeat.js?v=108"></script>
<script src="js/tour.js?v=109"></script>
<script src="js/home.js?v=105"></script>
</body>
</html>
