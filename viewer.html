<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exhibitor directory</title>
<link rel="stylesheet" href="styles.css?v=53" />
<link rel="stylesheet" href="viewer.css?v=53" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%234f7cff'/><g fill='none' stroke='white' stroke-width='8'><rect x='22' y='22' width='24' height='24'/><rect x='54' y='22' width='24' height='24'/><rect x='22' y='54' width='56' height='24'/></g></svg>" />
</head>
<body class="viewer">

<div id="app">

  <header class="v-top">
    <div class="v-brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="20" fill="var(--accent)"/>
        <g fill="none" stroke="#fff" stroke-width="8">
          <rect x="22" y="22" width="24" height="24"/>
          <rect x="54" y="22" width="24" height="24"/>
          <rect x="22" y="54" width="56" height="24"/>
        </g>
      </svg>
      <div>
        <div class="v-title" id="showName">Exhibitor directory</div>
        <div class="v-sub" id="showMeta"></div>
      </div>
    </div>

    <div class="v-actions">
      <button class="tb" id="vZoomOut" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="tb" id="vZoomIn" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="tb" id="vFit" title="Fit to screen" aria-label="Fit to screen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="tb" id="vTheme" title="Toggle light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M20 14a8 8 0 1 1-10-10 7 7 0 0 0 10 10Z"/></svg>
      </button>
    </div>
  </header>

  <div class="v-body">
    <aside class="v-list" id="vList">
      <div class="v-search">
        <svg viewBox="0 0 24 24" class="search-ic"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="vSearch" placeholder="Search exhibitors or booth numbers…"
               spellcheck="false" autocomplete="off" aria-label="Search exhibitors" />
      </div>
      <div class="v-count" id="vCount"></div>
      <div class="v-results" id="vResults"></div>
    </aside>

    <main class="v-stage" id="vStage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="v-scopebar" id="vScopeBar" hidden>
        <button id="vBack">
          <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg> Back to floor plan
        </button>
        <span id="vScopeLabel"></span>
      </div>

      <div class="v-card" id="vCard" hidden></div>

      <div class="v-empty" id="vEmpty" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 9h18"/></svg>
        <b>No floor plan published yet</b>
        <span>Open Floorplan Studio and choose <b>Publish public directory</b> from the Export menu.</span>
      </div>
    </main>
  </div>
</div>

<script src="js/geometry.js?v=53"></script>
<script src="js/config.js?v=53"></script>
<script src="js/state.js?v=53"></script>
<script src="js/rules.js?v=53"></script>
<script src="js/render.js?v=53"></script>
<script src="js/viewer.js?v=53"></script>
</body>
</html>
